[package]
name = "tronzap-sdk"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "Official Rust SDK for the TronZap API: buy TRON energy and bandwidth to cut USDT (TRC20) transfer fees"
homepage = "https://tronzap.com/"
repository = "https://github.com/tron-energy-market/tronzap-sdk-rust"
documentation = "https://docs.rs/tronzap-sdk"
readme = "README.md"
license = "MIT"
authors = ["TronZap <support@tronzap.com>"]
keywords = ["tron", "energy", "trc20", "usdt", "tronzap"]
categories = ["api-bindings", "cryptography::cryptocurrencies", "asynchronous"]
include = ["/src", "/README*.md", "/CHANGELOG.md", "/LICENSE"]

[features]
default = ["rustls"]
rustls = ["reqwest/rustls", "dep:rustls"]
native-tls = ["reqwest/native-tls", "dep:native-tls"]
system-proxy = ["reqwest/system-proxy"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
sha2 = "0.11"
rust_decimal = { version = "1.37", default-features = false, features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
native-tls = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "time"] }
wiremock = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[package.metadata.docs.rs]
all-features = true
