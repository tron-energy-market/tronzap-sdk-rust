version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Raising a requirement in Cargo.toml raises the minimum for every consumer.
    versioning-strategy: lockfile-only
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: chore
